name: cisqua
services:
  cisqua:
    container_name: cisqua-web
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Etc/UTC
      - RACK_ENV=production
      - UMASK=0022
    healthcheck:
      interval: 60s
      retries: 2
      start_period: 60s
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:4567/
      timeout: 5s
    image: pathsny/cisqua:latest
    ports:
      - "4567:4567"
    pull_policy: always
    restart: unless-stopped
    user: "1005:1000"
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/pool1/apps/cisqua
        target: /usr/src/app/data
        type: bind
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/pool1/media
        target: /media
        type: bind
  redis:
    container_name: cisqua-redis
    healthcheck:
      interval: 60s
      retries: 2
      start_period: 60s
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    pull_policy: always
    restart: unless-stopped
    user: "1005:1000"
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/pool1/apps/cisqua
        target: /data
        type: bind
version: "3.8"
