version: '3.8'
name: cisqua

services:
  cisqua:
    image: pathsny/cisqua:latest
    container_name: cisqua-web
    pull_policy: always
    ports:
      - "4567:4567"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Etc/UTC
      - RACK_ENV=production
      - UMASK=0022
    volumes:
      - type: bind
        source: /mnt/pool1/apps/cisqua
        target: /usr/src/app/data
        bind:
          create_host_path: false
          propagation: rprivate
        read_only: false
      - type: bind
        source: /mnt/pool1/media
        target: /media
        bind:
          create_host_path: false
          propagation: rprivate
        read_only: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s

  redis:
    image: redis/redis-stack-server:latest
    container_name: cisqua-redis
    pull_policy: always
    ports:
      - "6379:6379"
    volumes:
      - type: bind
        source: /mnt/pool1/apps/cisqua
        target: /data
        bind:
          create_host_path: false
          propagation: rprivate
        read_only: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s
